<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海龟法则回测 — AI Quant Lab</title>
<link rel="stylesheet" href="../shared/common.css">
<style>
:root {
  --bg:#fff; --bg2:#f5f5f5; --card:#fafafa; --bd:#e5e7eb; --elevated:#f0f0f0;
  --tx:#1a1a2e; --tx2:#6b7280; --tx3:#9ca3af;
  --red:#dc2626; --green:#059669; --blue:#2563eb; --gold:#d97706; --purple:#7c3aed;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);font-size:13px;color:var(--tx);background:var(--bg2);line-height:1.5;min-height:100vh}
.app{display:flex;min-height:calc(100vh - 48px)}
.sidebar{width:280px;min-width:280px;background:var(--bg);border-right:1px solid var(--bd);padding:14px;overflow-y:auto;position:sticky;top:49px;max-height:calc(100vh - 49px)}
.main{flex:1;padding:16px 20px;overflow-y:auto}
.panel-section{margin-bottom:14px}
.panel-label{font-size:11px;color:var(--tx2);text-transform:uppercase;margin-bottom:4px;letter-spacing:.5px}
select,input[type=number]{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:7px 8px;border-radius:6px;font-size:13px}
input[type=range]{width:100%;accent-color:var(--blue);margin:4px 0}
.range-row{display:flex;align-items:center;gap:6px}
.range-val{min-width:30px;text-align:right;font-size:13px;color:var(--tx2);font-weight:600}
.presets{display:flex;gap:4px;flex-wrap:wrap}
.presets button{flex:1;background:var(--bg2);color:var(--tx2);border:1px solid var(--bd);padding:5px 4px;border-radius:5px;font-size:11px;cursor:pointer;min-width:55px}
.presets button:hover{border-color:var(--blue);color:var(--tx)}
.presets button.active{background:var(--blue);border-color:var(--blue);color:#fff}
.btn{width:100%;background:var(--blue);color:#fff;border:none;padding:8px;border-radius:6px;font-size:13px;cursor:pointer;font-weight:600;margin-top:6px}
.btn:hover{opacity:.9}
.metrics-cards{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
.m-card{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;text-align:center}
.m-label{font-size:10px;color:var(--tx2);text-transform:uppercase;margin-bottom:2px}
.m-value{font-size:18px;font-weight:700}
.up{color:var(--red)}.down{color:var(--green)}
.chart-section{margin-bottom:16px}
.chart-section h3{font-size:14px;margin-bottom:8px;color:var(--tx2)}
.chart-panel{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:14px}
.chart-wrap{position:relative;height:300px}
.chart-wrap-sm{position:relative;height:160px;margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 8px;text-align:left;white-space:nowrap}
th{background:var(--bg2);color:var(--tx2);font-weight:600;font-size:11px;text-transform:uppercase;cursor:pointer}
td{border-top:1px solid var(--bd)}
tr:hover td{background:rgba(37,99,235,.04)}
.sort-asc::after{content:' ↑'}.sort-desc::after{content:' ↓'}
.status{text-align:center;font-size:11px;color:var(--tx2);margin-top:6px}
@media(max-width:800px){.app{flex-direction:column}.sidebar{width:100%;min-width:0;position:static;max-height:none;border-right:none;border-bottom:1px solid var(--bd)}.metrics-cards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:500px){.metrics-cards{grid-template-columns:repeat(2,1fr)}}
</style>
<script src="../shared/lib/chart.umd.min.js"></script>
</head>
<body>

<nav class="site-nav">
  <a href="/ai-quant-lab/" class="nav-brand">🧪 AI Quant Lab</a>
  <div class="nav-links">
    <a href="/ai-quant-lab/indicator-lab/">📊 指标实验室</a>
    <a href="/ai-quant-lab/turtle-strategy/" class="active">🐢 海龟法则</a>
    <a href="/ai-quant-lab/ma-cross/">📈 均线交叉</a>
  </div>
</nav>

<div class="app">
<aside class="sidebar">
<div class="panel-section">
  <div class="panel-label">📌 标的</div>
  <select id="stock-selector"></select>
</div>
<div class="panel-section">
  <div class="panel-label">📅 时段</div>
  <div class="presets" id="period-presets">
    <button data-years="3" class="active">3年</button>
    <button data-years="1">1年</button>
    <button data-months="6">6月</button>
    <button data-months="3">3月</button>
  </div>
</div>
<div class="panel-section">
  <div class="panel-label">⚙ 参数预设</div>
  <div class="presets" id="param-presets">
    <button data-preset="classic" class="active">🐢经典</button>
    <button data-preset="fast">🐇短线</button>
    <button data-preset="slow">🐘长线</button>
  </div>
</div>
<div class="panel-section"><div class="panel-label">入场通道周期</div>
  <div class="range-row"><input type="range" id="entry-period" min="5" max="120" value="20"><span class="range-val" id="entry-period-val">20</span></div>
</div>
<div class="panel-section"><div class="panel-label">退出通道周期</div>
  <div class="range-row"><input type="range" id="exit-period" min="3" max="60" value="10"><span class="range-val" id="exit-period-val">10</span></div>
</div>
<div class="panel-section"><div class="panel-label">ATR 周期</div>
  <div class="range-row"><input type="range" id="atr-period" min="5" max="60" value="20"><span class="range-val" id="atr-period-val">20</span></div>
</div>
<div class="panel-section"><div class="panel-label">加仓步长</div>
  <div class="range-row"><input type="range" id="add-step" min="0.1" max="2" value="0.5" step="0.1"><span class="range-val" id="add-step-val">0.5</span></div>
</div>
<div class="panel-section"><div class="panel-label">最大单位</div>
  <div class="presets" id="max-units-group">
    <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button data-value="4" class="active">4</button>
    <button data-value="5">5</button><button data-value="6">6</button><button data-value="7">7</button><button data-value="8">8</button>
  </div>
</div>
<div class="panel-section"><div class="panel-label">止损倍数</div>
  <div class="range-row"><input type="range" id="stop-multiple" min="0.5" max="5" value="2" step="0.1"><span class="range-val" id="stop-multiple-val">2.0</span></div>
</div>
<div class="panel-section"><div class="panel-label">风险预算 %</div>
  <div class="range-row"><input type="range" id="risk-fraction" min="0.1" max="5" value="1" step="0.1"><span class="range-val" id="risk-fraction-val">1.0</span></div>
</div>
<button class="btn" id="btn-run">▶ 运行回测</button>
<div class="status" id="run-status"></div>
</aside>

<main class="main">
<div id="metrics-container"><div style="text-align:center;padding:40px;color:var(--tx2)">选择参数后自动回测...</div></div>
<div class="chart-section"><h3>📈 净值曲线</h3><div class="chart-panel"><div class="chart-wrap"><canvas id="equity-plot"></canvas></div></div></div>
<div class="chart-section"><h3>🔍 交易信号</h3><div class="chart-panel"><div class="chart-wrap"><canvas id="signal-plot"></canvas></div><div class="chart-wrap-sm"><canvas id="atr-plot"></canvas></div></div></div>
<div class="chart-section"><h3>📋 交易明细</h3><div class="table-wrap"><table><thead><tr><th>入场日期</th><th>出场日期</th><th>入场价</th><th>出场价</th><th>收益率</th><th>持仓天</th></tr></thead><tbody id="trades-body"></tbody></table></div></div>
</main>
</div>

<script src="../indicator-lab/data.js"></script>
<script src="js/turtle_engine.js"></script>
<script>
const TE = TurtleEngine;

// Convert data.js format to turtle_engine format
function convertData(raw) {
  return raw.data.map(r => ({
    date: r.d, open: r.o, high: r.h, low: r.l, close: r.c, volume: r.v
  }));
}

const STOCK_MAP = {};
STOCK_DATA.forEach(s => { STOCK_MAP[s.key.replace('_SH','.SH').replace('_SZ','.SZ').replace('_HK','.HK')] = s; });

const PRESETS = {
  classic: {en:20,ex:10,at:20,as:0.5,mu:4,sm:2.0,rf:1.0},
  fast:{en:10,ex:5,at:10,as:0.3,mu:3,sm:1.5,rf:1.5},
  slow:{en:60,ex:20,at:30,as:1.0,mu:2,sm:3.0,rf:0.5},
};

let state={equityChart:null,signalChart:null,atrChart:null,timer:null};
function fmtPct(v){return v==null?'N/A':(v*100).toFixed(2)+'%'}
function up(v){return v>=0?'up':'down'}

function getParams(){
  return {
    entry_period:+document.getElementById('entry-period').value,
    exit_period:+document.getElementById('exit-period').value,
    atr_period:+document.getElementById('atr-period').value,
    add_unit_step:+document.getElementById('add-step').value,
    max_units:+document.getElementById('max-units-group').querySelector('.active').dataset.value,
    stop_multiple:+document.getElementById('stop-multiple').value,
    risk_fraction:+document.getElementById('risk-fraction').value/100,
    initial_capital:100000,commission_rate:0.0003,slippage:0.0001,
  };
}

function getRange(data){
  const act=document.getElementById('period-presets').querySelector('.active');
  const now=new Date(data[data.length-1].date);let cutoff;
  if(act.dataset.years){cutoff=new Date(now);cutoff.setFullYear(cutoff.getFullYear()- +act.dataset.years)}
  else if(act.dataset.months){cutoff=new Date(now);cutoff.setMonth(cutoff.getMonth()- +act.dataset.months)}
  else cutoff=new Date(0);
  return data.filter(d=>new Date(d.date)>=cutoff);
}

function run(){
  const tsCode=document.getElementById('stock-selector').value;
  const raw=STOCK_MAP[tsCode];if(!raw)return;
  const full=convertData(raw);
  const params=getParams();params.ts_code=tsCode;
  const data=getRange(full);
  document.getElementById('run-status').textContent='计算中...';
  const t0=performance.now();
  const res=TE.runBacktest(data,params);
  const m=TE.computeMetrics(res.equityRecords,res.tradeRecords,100000);
  const det=TE.exportDetailData(data,params,Math.min(150,data.length));
  document.getElementById('run-status').textContent=`✓ ${(performance.now()-t0).toFixed(0)}ms · ${data.length}行 · ${res.tradeRecords.length}笔`;
  renderMetrics(m);renderEquity(res.equityRecords,params,m);
  renderSignal(det);renderATR(det);renderTrades(res.tradeRecords);
}

function trigger(){clearTimeout(state.timer);state.timer=setTimeout(run,400);}

function renderMetrics(m){
  document.getElementById('metrics-container').innerHTML=
  `<div class="metrics-cards">${
    [['年化收益',fmtPct(m.annualizedReturn),up(m.annualizedReturn)],
     ['夏普比率',(m.sharpeRatio||0).toFixed(2),''],
     ['最大回撤',fmtPct(m.maxDrawdown),'down'],
     ['胜率',fmtPct(m.winRate),''],
     ['交易笔数',(m.totalTrades||0)+'笔',''],
     ['止损次数',(m.stopLossCount||0)+'次','']]
    .map(([l,v,c])=>`<div class="m-card"><div class="m-label">${l}</div><div class="m-value ${c}">${v}</div></div>`).join('')
  }</div>`;
}

function renderEquity(eq,params,m){
  if(state.equityChart)state.equityChart.destroy();
  const labels=eq.map(e=>e.date.slice(5));
  const se=eq.map(e=>e.totalEquity);
  const fc=eq[0]?.close||1;
  const be=eq.map(e=>params.initial_capital*(1+(e.close-fc)/fc));
  const ap=m.avgPositionPct||0.05;
  const ep=eq.map(e=>params.initial_capital*(1-ap)+params.initial_capital*ap*(e.close/fc));
  const ctx=document.getElementById('equity-plot').getContext('2d');
  state.equityChart=new Chart(ctx,{type:'line',data:{labels,datasets:[
    {label:'策略',data:se,borderColor:'#dc2626',borderWidth:2,pointRadius:0},
    {label:'满仓买入持有',data:be,borderColor:'#9ca3af',borderWidth:.8,borderDash:[3,5],pointRadius:0},
    {label:'等仓位买入持有',data:ep,borderColor:'#2563eb',borderWidth:1.2,borderDash:[8,3],pointRadius:0},
  ]},options:{responsive:true,maintainAspectRatio:false,
    interaction:{mode:'index',intersect:false},
    plugins:{legend:{labels:{color:'#6b7280',usePointStyle:true,padding:14,font:{size:11}}}},
    scales:{x:{ticks:{color:'#9ca3af',maxTicksLimit:10},grid:{color:'rgba(0,0,0,.06)'}},
            y:{ticks:{color:'#9ca3af',callback:v=>'¥'+(v/10000).toFixed(1)+'万'},grid:{color:'rgba(0,0,0,.06)'}}}
  }});
}

function renderSignal(det){
  if(state.signalChart)state.signalChart.destroy();
  const labels=det.labels.map(d=>d.slice(5));
  const toScat=pts=>pts.map(p=>({x:p.date.slice(5),y:p.price}));
  const ctx=document.getElementById('signal-plot').getContext('2d');
  state.signalChart=new Chart(ctx,{type:'line',data:{labels,datasets:[
    {label:'收盘价',data:det.close,borderColor:'#374151',borderWidth:1.5,pointRadius:0},
    {label:'入场上轨',data:det.entryUpper,borderColor:'rgba(220,38,38,.4)',borderWidth:1,borderDash:[6,3],pointRadius:0},
    {label:'入场下轨',data:det.entryLower,borderColor:'rgba(5,150,105,.4)',borderWidth:1,borderDash:[6,3],pointRadius:0},
    {label:'▲入场',type:'scatter',data:toScat(det.entryPoints),backgroundColor:'#dc2626',pointRadius:6,pointStyle:'triangle'},
    {label:'▼退出',type:'scatter',data:toScat(det.exitPoints),backgroundColor:'#059669',pointRadius:6,pointStyle:'triangle',rotation:180},
  ]},options:{responsive:true,maintainAspectRatio:false,
    interaction:{mode:'index',intersect:false},
    plugins:{legend:{position:'top',labels:{color:'#6b7280',usePointStyle:true,padding:8,font:{size:10},boxWidth:14}}},
    scales:{x:{ticks:{color:'#9ca3af',maxTicksLimit:10},grid:{color:'rgba(0,0,0,.06)'}},
            y:{ticks:{color:'#9ca3af',callback:v=>'¥'+v.toFixed(1)},grid:{color:'rgba(0,0,0,.06)'}}}
  }});
}

function renderATR(det){
  if(state.atrChart)state.atrChart.destroy();
  const ctx=document.getElementById('atr-plot').getContext('2d');
  state.atrChart=new Chart(ctx,{type:'line',data:{labels:det.labels.map(d=>d.slice(5)),datasets:[
    {label:'ATR',data:det.atr,borderColor:'#d97706',borderWidth:1.5,pointRadius:0,fill:false},
  ]},options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{color:'#6b7280',font:{size:10},padding:4}}},
    scales:{x:{ticks:{color:'#9ca3af',maxTicksLimit:8},grid:{color:'rgba(0,0,0,.06)'}},
            y:{ticks:{color:'#9ca3af'},grid:{color:'rgba(0,0,0,.06)'}}}
  }});
}

function renderTrades(trades){
  const tb=document.getElementById('trades-body');
  if(!trades.length){tb.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--tx2);padding:16px">无交易记录</td></tr>';return}
  tb.innerHTML=trades.map(t=>`<tr>
    <td>${(t.entryDate||'').slice(0,10)}</td><td>${(t.exitDate||'').slice(0,10)}</td>
    <td>¥${t.entryPrice?.toFixed(2)}</td><td>¥${t.exitPrice?.toFixed(2)}</td>
    <td class="${up(t.returnPct)}">${fmtPct(t.returnPct)}</td><td>${t.holdingDays||0}</td>
  </tr>`).join('');
}

// Init
function init(){
  const sel=document.getElementById('stock-selector');
  STOCK_DATA.forEach(s=>{
    const c=s.key.replace('_SH','.SH').replace('_SZ','.SZ').replace('_HK','.HK');
    sel.innerHTML+=`<option value="${c}">${s.name} (${c})</option>`;
  });
  sel.onchange=trigger;
  ['entry-period','exit-period','atr-period','add-step','stop-multiple','risk-fraction'].forEach(id=>{
    const el=document.getElementById(id),ve=document.getElementById(id+'-val');
    el.oninput=()=>{ve.textContent=el.value;trigger();};
  });
  document.querySelectorAll('#period-presets button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#period-presets button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');trigger();
  });
  document.querySelectorAll('#param-presets button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#param-presets button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');const p=PRESETS[b.dataset.preset];
    document.getElementById('entry-period').value=p.en;document.getElementById('entry-period-val').textContent=p.en;
    document.getElementById('exit-period').value=p.ex;document.getElementById('exit-period-val').textContent=p.ex;
    document.getElementById('atr-period').value=p.at;document.getElementById('atr-period-val').textContent=p.at;
    document.getElementById('add-step').value=p.as;document.getElementById('add-step-val').textContent=p.as;
    document.getElementById('stop-multiple').value=p.sm;document.getElementById('stop-multiple-val').textContent=p.sm;
    document.getElementById('risk-fraction').value=p.rf;document.getElementById('risk-fraction-val').textContent=p.rf;
    document.querySelectorAll('#max-units-group button').forEach(x=>x.classList.toggle('active',+x.dataset.value===p.mu));
    trigger();
  });
  document.querySelectorAll('#max-units-group button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#max-units-group button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');trigger();
  });
  document.getElementById('btn-run').onclick=run;
  run();
}
document.addEventListener('DOMContentLoaded',init);
</script>
<footer class="site-footer"><p>🧪 AI Quant Lab · <a href="/ai-quant-lab/">首页</a> · <a href="https://github.com/waanng/ai-quant-lab" target="_blank">GitHub</a></p></footer>
</body>
</html>
